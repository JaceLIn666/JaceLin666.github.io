<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>作品集</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
    background:#ffffff;
}
#box img{
    width:100%;
    display:block;
    margin-bottom:10px;
}
</style>
</head>
<body>
<div id="box"></div>
<script>
const pics = [
"images/p1.png",
"images/p2.png",
"images/p3.png",
"images/p4.png",
"images/p5.png",
"images/p6.png",
"images/p7.png",
"images/p8.png",
"images/p9.png",
"images/p10.png",
"images/p11.png",
"images/p12.png",
"images/p13.png",
"images/p14.png",
"images/p15.png",
"images/p16.png",
"images/p17.png",
"images/p18.png",
"images/p19.png",
"images/p20.png",
"images/p21.png",
"images/p22.png",
"images/p23.png",
"images/p24.png",
"images/p25.png",
"images/p26.png",
"images/p27.png",
"images/p28.png",
];
const box=document.getElementById("box");

pics.forEach(s=>{
    let img=new Image();
    img.src=s;
    img.loading="lazy";
    box.appendChild(img);
})
</script>
</body>
</html>
